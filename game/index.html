<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Kilat Courier — midnight parcel run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d24; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #0a0d24; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Kilat Courier: ride the courier bike, dodge traffic, grab parcels and deliver them to the matching house"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
